---
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish bottles
        # Bottle the binaries goreleaser just built instead of
        # recompiling: bottles carry the exact release bytes.
        run: go run . release --source local
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOBOTTLE_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Keep the bottles manifest
        # If the tap commit fails after the bottles were pushed, the
        # formula step can be replayed without rebuilding:
        #   gh run download <run-id> -n bottles-manifest-<tag>
        #   gobottle release -i bottles.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles-manifest-${{ github.ref_name }}
          path: bottles/bottles.json
          if-no-files-found: ignore

      - name: Attest release artifacts
        # Subjects cover every distribution surface: release archives and
        # checksums, the raw binaries (verifiable post-install), and the
        # bottle tarballs brew downloads. Runs whenever bottles exist, so
        # what reached GHCR is attested even if the tap commit failed.
        if: ${{ !cancelled() && hashFiles('bottles/*.tar.gz') != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*_SHA256SUMS
            dist/*/gobottle
            bottles/*.tar.gz
